name: Build Windows Portable

on:
  push:
    branches: [ "v0.5" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        target: 'desktop'
        arch: 'win64_msvc2022_64'

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release .. 
        cmake --build . --config Release

    - name: Deploy Qt Dependencies
      run: |
        mkdir Phoca-Windows
        Get-ChildItem -Path build -Filter phoca.exe -Recurse | Copy-Item -Destination Phoca-Windows\
        windeployqt Phoca-Windows\phoca.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Phoca-Win-Portable
        path: Phoca-Windows\
