app-id: io.github.maxipardo.phoca
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: phoca
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
modules:
  # ffmpeg, ffmprobe
  - name: ffmpeg-full
    buildsystem: simple
    build-commands:
      - install -D -m 755 bin/ffmpeg /app/bin/ffmpeg
      - install -D -m 755 bin/ffprobe /app/bin/ffprobe
    sources:
      - type: archive
        url: https://github.com/yt-dlp/FFmpeg-Builds/releases/download/autobuild-2026-10-09-19-22/ffmpeg-N-127264-gf5d4fd186c-linux64-gpl.tar.xz
        sha256: a5e1bf969bfbd2f17c8cc768db9b73bc769fcf1273c42801f1e446dfbed53e30
  # Deno
  - name: deno
    buildsystem: simple
    build-commands:
      - install -D -m 755 deno /app/bin/deno
    sources:
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-unknown-linux-gnu.zip
        sha256: 8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530

  # yt-dlp
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -D -m 755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.09.16.232951/yt-dlp
        sha256: f8ca14db511702a5dbfc5a527056312907ddd0914d0b4036f108d6849e17ef61
        dest-filename: yt-dlp

  # Phoca
  - name: phoca
    buildsystem: cmake
    config-opts:
      - -DFLATPAK_BUILD=ON
    sources:
      - type: git
        url: https://github.com/maxipardo/Phoca.git
        branch: main
