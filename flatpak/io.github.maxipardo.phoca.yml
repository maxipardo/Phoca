app-id: io.github.maxipardo.phoca
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: phoca
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

modules:
  # ffmpeg, ffmprobe
  - name: ffmpeg-full
    buildsystem: simple
    build-commands:
      - install -D -m 755 bin/ffmpeg /app/bin/ffmpeg
      - install -D -m 755 bin/ffprobe /app/bin/ffprobe
    sources:
      - type: archive
        url: https://github.com/yt-dlp/FFmpeg-Builds/releases/download/autobuild-2026-09-11-17-43/ffmpeg-N-126504-g1b8a2b690b-linux64-gpl.tar.xz
        sha256: c96db845d473c168b53174407b10547abb2b4b50f6401350791c0033cb3fbf83
  # Deno
  - name: deno
    buildsystem: simple
    build-commands:
      - install -D -m 755 deno /app/bin/deno
    sources:
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-unknown-linux-gnu.zip
        sha256: 8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530

  # Phoca
  - name: phoca
    buildsystem: cmake
    config-opts:
      - -DFLATPAK_BUILD=ON
    sources:
      - type: git
        url: https://github.com/maxipardo/Phoca.git
        branch: main
